# DIET (ReadyNAS Duo v1, Linux 6.18). The fan curve is in /etc/fan.conf
# (padre-fan); the web interface edits both.
SPINDOWN_MIN=30        # disk spin-down after x minutes without access (0 = never)
# Services (Services card of the interface): 0 = stopped, and not started at
# boot; 1 or missing = running.
SVC_MINIDLNA=1
SVC_AVAHI=1
SVC_RSYNC=1
SVC_WEBDAV=1
