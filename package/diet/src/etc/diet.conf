# DIET (ReadyNAS Duo v1, Linux 6.18). La courbe du ventilateur est dans
# /etc/ventilateur.conf (padre-ventilateur) ; l'interface web modifie les deux.
SPINDOWN_MIN=30        # veille des disques après x minutes sans accès (0 = jamais)
# Services (carte Services de l'interface) : 0 = arrêté, et pas lancé au
# démarrage ; 1 ou absent = en marche.
SVC_MINIDLNA=1
SVC_AVAHI=1
SVC_RSYNC=1
SVC_WEBDAV=1
