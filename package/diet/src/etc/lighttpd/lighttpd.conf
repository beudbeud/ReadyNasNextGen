# lighttpd: DIET web interface of the ReadyNAS Duo v1 (Linux 6.18).
#   HTTPS 443: /www page, CGI API /cgi-bin/api, Basic authentication
#              /api/v1/<action>: the same API with a Bearer token (docs/API.md)
#              /metrics: Prometheus, off by default (docs/DIET.md "Prometheus")
#   HTTP 80  : redirect to HTTPS
# Certificate: created by /etc/init.d/S50lighttpd at first boot.
# Password: chosen on the "First setup" page (/cgi-bin/setup) of a new install,
# then in the interface or with diet-webpass (/etc/lighttpd/htpasswd).
# Check: lighttpd -tt -f /etc/lighttpd/lighttpd.conf
#
# lighttpd (and so the API) runs as root, like the httpd of the old
# DIET: the API writes /etc, runs ksmbd.adduser, exportfs, reboot. A dedicated
# user would need a setuid helper or sudo.

# mod_redirect before mod_auth (same request phase, run in this order): port 80
# redirects to HTTPS before any password is asked, and so does the first-setup
# redirection below.
server.modules = (
	"mod_mbedtls",
	"mod_access",
	"mod_alias",
	"mod_setenv",
	"mod_redirect",
	"mod_rewrite",
	"mod_auth",
	"mod_authn_file",
	"mod_cgi",
	"mod_proxy",
)

server.port = 443
server.document-root = "/www"
server.pid-file = "/var/run/lighttpd.pid"
server.errorlog-use-syslog = "enable"
server.upload-dirs = ( "/tmp" )
server.tag = ""
index-file.names = ( "index.html" )
mimetype.assign = ( ".html" => "text/html; charset=utf-8", ".svg" => "image/svg+xml", ".json" => "application/json",
	".prom" => "text/plain; version=0.0.4; charset=utf-8" )

# 280 MHz processor, software cryptography: keep connections open (the page
# refreshes every 15 s: one TLS handshake per visit, not per request), HTTP/2
# (default since 1.4.65; one connection for every request of the page), and
# TLS session tickets (mod_mbedtls default, written here: a new connection after
# 120 s idle resumes the session instead of a full ECDHE + ECDSA handshake)
server.max-connections = 32
server.max-keep-alive-requests = 1000
server.max-keep-alive-idle = 120
server.feature-flags += ( "server.h2proto" => "enable" )

# TLS 1.2/1.3, ECDHE only, ECDSA P-256 certificate; ChaCha20 first
# (much faster than AES without dedicated instructions).
ssl.engine = "enable"
ssl.pemfile = "/etc/lighttpd/ssl/server.pem"
ssl.privkey = "/etc/lighttpd/ssl/server.key"
ssl.openssl.ssl-conf-cmd = (
	"MinProtocol" => "TLSv1.2",
	"Ciphersuites" => "TLS1-3-CHACHA20-POLY1305-SHA256:TLS1-3-AES-128-GCM-SHA256:TLS1-3-AES-256-GCM-SHA384:TLS-ECDHE-ECDSA-WITH-CHACHA20-POLY1305-SHA256:TLS-ECDHE-ECDSA-WITH-AES-128-GCM-SHA256:TLS-ECDHE-ECDSA-WITH-AES-256-GCM-SHA384",
	"Curves" => "secp256r1:x25519",
	"Options" => "ServerPreference,SessionTicket",
)

# private networks only
$HTTP["remote-ip"] != "192.168.0.0/16" {
	$HTTP["remote-ip"] != "10.0.0.0/8" {
		$HTTP["remote-ip"] != "172.16.0.0/12" {
			$HTTP["remote-ip"] != "127.0.0.1" {
				url.access-deny = ( "" )
			}
		}
	}
}

auth.backend = "htpasswd"
auth.backend.htpasswd.userfile = "/etc/lighttpd/htpasswd"
# Remember a checked password for 10 min: SHA-512 crypt costs 0.35 s of CPU per
# request on the Padre (single-process lighttpd), cached 0.006 s. A cached user
# with another password is refused until max-age, so a password change restarts
# lighttpd (setup page, diet-webpass).
auth.cache = ( "max-age" => "600" )
# the interface: administrator account; /webdav: user accounts, checked by
# the WebDAV instance (no WebDAV access for the administrator); /api/v1/ (and
# /cgi-bin/v1, its target) and /metrics: access token checked by the API (Bearer:
# mod_auth has no such scheme), or /metrics open to the local network if chosen
# in Settings; /cgi-bin/setup: first setup, no account. That exception is permanent and limited to this exact
# URL; the API behind it (/cgi-bin/setup is a link to it) only answers while
# /etc/lighttpd/htpasswd does not exist, and creates it atomically (first one wins).
# Gating in the script rather than in this file: a condition here is fixed when
# lighttpd starts, the file test in the script is made at every request.
$HTTP["url"] !~ "^/(webdav(/|$)|cgi-bin/(setup|v1)$|api/v1/|metrics$)" {
	auth.require = ( "/" => ( "method" => "basic", "realm" => "DIET", "require" => "valid-user" ) )
}
# no administrator account yet (checked when lighttpd starts): the home page
# redirects to the first-setup page (302, not cached); lighttpd is restarted
# by the setup.
include_shell "/etc/init.d/S50lighttpd firstconf"

# Answers prepared by the collector (/var/run/diet/<key>.json, docs/DIET.md
# "Speed") served as static files: the periodic refresh of the page starts no
# CGI. Same authentication as the interface (rule above); only the
# collector's <key>.json, never its FIFO, pid, marks or temporary files.
$HTTP["url"] =^ "/cache/" {
	alias.url = ( "/cache/" => "/var/run/diet/" )
	setenv.set-response-header = ( "Cache-Control" => "no-store", "X-Content-Type-Options" => "nosniff" )
	$HTTP["url"] !~ "^/cache/[a-z]+\.json$" {
		url.access-deny = ( "" )
	}
}

# Token API: /api/v1/<action>?<parameters> -> the API under its "v1" name, which
# requires "Authorization: Bearer <token>" (read-only tokens: GET only). Anything
# else under /api/v1/ is not found.
$HTTP["url"] =^ "/api/v1/" {
	url.rewrite-once = ( "^/api/v1/([a-z_]+)(?:\?(.*))?$" => "/cgi-bin/v1?a=$1&$2" )
}
# /metrics (METRICS of /etc/diet.conf, read when lighttpd starts; the API restarts
# lighttpd when it changes): 0 = refused (403); 1 = rewritten to the API, which
# checks the token and sends the collector file; 2 = the collector file
# /var/run/diet/metrics.prom served as a static file, no authentication (the
# private networks rule above still applies).
include_shell "/etc/init.d/S50lighttpd metricsconf"

$HTTP["url"] =^ "/cgi-bin/" {
	cgi.assign = ( "" => "" )
	# system update package (tens of MB): streamed to the API, which writes it
	# to the USB stick, instead of being buffered first in /tmp (RAM)
	$HTTP["querystring"] =~ "(^|&)a=update_upload(&|$)" {
		server.stream-request-body = 2
	}
}

# WebDAV (https://<nas>/webdav/<user>/ and /webdav/<share>/): second lighttpd
# instance as user nas (S51webdav, /etc/lighttpd/webdav.conf generated by the
# API), proxied here; bodies streamed (no whole file in memory in /tmp).
# Instance stopped: 503.
$HTTP["url"] =~ "^/webdav(/|$)" {
	proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8081 ) ) )
	server.stream-request-body = 2
	server.stream-response-body = 2
}

$SERVER["socket"] == ":80" {
	ssl.engine = "disable"
	url.redirect-code = 301
	url.redirect = ( "" => "https://${url.authority}${url.path}${qsa}" )
}
