# lighttpd : interface web DIET du ReadyNAS Duo v1 (Linux 6.18).
#   HTTPS 443 : page /www, API CGI /cgi-bin/api, authentification Basic
#   HTTP 80   : redirection vers HTTPS
# Certificat : créé par /etc/init.d/S50lighttpd au premier démarrage.
# Mot de passe : diet-webpass (/etc/lighttpd/htpasswd ; absent = accès refusé).
# Vérifier : lighttpd -tt -f /etc/lighttpd/lighttpd.conf
#
# ponytail: lighttpd (et donc l'API) tourne en root, comme le httpd de l'ancien
# DIET : l'API écrit /etc, lance ksmbd.adduser, exportfs, reboot. Passer par
# un utilisateur dédié demanderait un assistant setuid ou sudo.

server.modules = (
	"mod_mbedtls",
	"mod_access",
	"mod_auth",
	"mod_authn_file",
	"mod_redirect",
	"mod_cgi",
)

server.port = 443
server.document-root = "/www"
server.pid-file = "/var/run/lighttpd.pid"
server.errorlog-use-syslog = "enable"
server.upload-dirs = ( "/tmp" )
server.tag = ""
index-file.names = ( "index.html" )
mimetype.assign = ( ".html" => "text/html; charset=utf-8", ".svg" => "image/svg+xml" )

# processeur à 280 MHz, cryptographie logicielle : garder les connexions
server.max-connections = 32
server.max-keep-alive-requests = 1000
server.max-keep-alive-idle = 120

# TLS 1.2/1.3, ECDHE seulement, certificat ECDSA P-256 ; ChaCha20 d'abord
# (bien plus rapide qu'AES sans instructions dédiées).
ssl.engine = "enable"
ssl.pemfile = "/etc/lighttpd/ssl/server.pem"
ssl.privkey = "/etc/lighttpd/ssl/server.key"
ssl.openssl.ssl-conf-cmd = (
	"MinProtocol" => "TLSv1.2",
	"Ciphersuites" => "TLS1-3-CHACHA20-POLY1305-SHA256:TLS1-3-AES-128-GCM-SHA256:TLS1-3-AES-256-GCM-SHA384:TLS-ECDHE-ECDSA-WITH-CHACHA20-POLY1305-SHA256:TLS-ECDHE-ECDSA-WITH-AES-128-GCM-SHA256:TLS-ECDHE-ECDSA-WITH-AES-256-GCM-SHA384",
	"Curves" => "secp256r1:x25519",
	"Options" => "ServerPreference",
)

# réseaux privés seulement
$HTTP["remote-ip"] != "192.168.0.0/16" {
	$HTTP["remote-ip"] != "10.0.0.0/8" {
		$HTTP["remote-ip"] != "172.16.0.0/12" {
			$HTTP["remote-ip"] != "127.0.0.1" {
				url.access-deny = ( "" )
			}
		}
	}
}

auth.backend = "htpasswd"
auth.backend.htpasswd.userfile = "/etc/lighttpd/htpasswd"
auth.require = ( "/" => ( "method" => "basic", "realm" => "DIET", "require" => "valid-user" ) )

$HTTP["url"] =^ "/cgi-bin/" {
	cgi.assign = ( "" => "" )
}

$SERVER["socket"] == ":80" {
	ssl.engine = "disable"
	url.redirect-code = 301
	url.redirect = ( "" => "https://${url.authority}${url.path}${qsa}" )
}
