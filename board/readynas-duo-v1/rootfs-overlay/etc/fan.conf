# Fan control (padre-fan), curve taken from diet-hwmon (DIET)
FAN_PWM_MIN=30          # idle setpoint (0..255), up to TEMP_LOW
FAN_PWM_MAX=255
TEMP_LOW=40             # hottest disk: below this, minimum setpoint
TEMP_HIGH=55            # from here on, full speed
DISK_HIGH=50            # one disk at this temperature: full speed
DISK_CRIT=62            # two readings in a row: emergency shutdown
PERIOD=60               # seconds between two readings
