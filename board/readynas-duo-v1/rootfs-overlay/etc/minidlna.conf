# ReadyMedia (MiniDLNA): DLNA/UPnP-AV server of the ReadyNAS Duo v1.
# Serves files as they are (no transcoding). The first scan is slow on this
# CPU; afterwards only changes are tracked.

# Shared folders: A = audio, V = video, P = pictures; no letter = everything.
media_dir=/c/media

# Name shown on the players (TV, set-top box, VLC...)
friendly_name=ReadyNAS

port=8200
# Database and thumbnails: on the system (USB key), not on the disks.
# /var/lib rather than /var/cache: here /var/cache points to /tmp (in memory),
# the database would be lost and everything rescanned at every boot.
db_dir=/var/lib/minidlna
log_dir=/var/log
log_level=general,artwork,database,inotify,scanner,metadata,http,ssdp,tivo=warn

# Track new files without a full rescan
inotify=yes
album_art_names=Cover.jpg/cover.jpg/AlbumArtSmall.jpg/albumartsmall.jpg/Folder.jpg/folder.jpg
strict_dlna=no
notify_interval=895
