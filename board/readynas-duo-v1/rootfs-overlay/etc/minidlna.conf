# ReadyMedia (MiniDLNA) — serveur DLNA/UPnP-AV du ReadyNAS Duo v1.
# Sert les fichiers tels quels (pas de transcodage). Indexation lente au premier
# démarrage sur ce processeur ; ensuite seules les modifications sont suivies.

# Dossiers partagés : A = audio, V = vidéo, P = images ; sans lettre = tout.
media_dir=/c/media

# Nom affiché sur les lecteurs (télé, box, VLC…)
friendly_name=ReadyNAS

port=8200
# Base de données et miniatures : sur le système (clé USB), pas sur les disques.
# /var/lib et non /var/cache : dans ce système /var/cache pointe vers /tmp (en
# mémoire), la base serait perdue et tout réindexé à chaque démarrage.
db_dir=/var/lib/minidlna
log_dir=/var/log
log_level=general,artwork,database,inotify,scanner,metadata,http,ssdp,tivo=warn

# Suivi des nouveaux fichiers sans réindexation complète
inotify=yes
album_art_names=Cover.jpg/cover.jpg/AlbumArtSmall.jpg/albumartsmall.jpg/Folder.jpg/folder.jpg
strict_dlna=no
notify_interval=895
