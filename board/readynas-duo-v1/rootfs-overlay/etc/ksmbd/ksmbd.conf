; ksmbd on the ReadyNAS Duo v1 (example; share /c, users: ksmbd.adduser)
[global]
	netbios name = READYNAS
	workgroup = WORKGROUP
	server min protocol = SMB2_10
	; SMB3 encryption is done by the 280 MHz CPU without hardware help and caps the
	; throughput far below the disks; it is off by default (Settings in the web
	; interface).
	; Signing (AES-CMAC, also by the CPU: ~3x slower): with "auto" (or "disabled",
	; same in ksmbd 6.18) a session is signed only when the client requires it
	; (Windows 11 24H2, macOS); Linux clients do not by default. "mandatory" makes
	; every client sign. Shares page of the web interface.
	smb3 encryption = disabled
	server signing = auto

[c]
	path = /c
	read only = no
