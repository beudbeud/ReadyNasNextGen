# Régulation du ventilateur (padre-ventilateur), courbe de diet-hwmon (DIET)
FAN_PWM_MIN=50          # consigne au repos (0..255), jusqu'à TEMP_LOW
FAN_PWM_MAX=255
TEMP_LOW=40             # disque le plus chaud : en dessous, consigne minimale
TEMP_HIGH=55            # à partir d'ici, plein régime
DISK_HIGH=50            # un disque à cette température : plein régime
DISK_CRIT=62            # deux mesures de suite : arrêt d'urgence
PERIODE=60              # secondes entre deux mesures
